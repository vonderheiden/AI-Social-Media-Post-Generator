<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Post - Social Media Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Your Post is Being Generated!</h1>
            <p style="text-align: center; margin: 20px 0;">AI generation will be implemented next.</p>
            <div id="topicDisplay" style="background: #f5f5f5; padding: 20px; border-radius: 8px; margin: 20px 0;"></div>
            <button onclick="window.location.href='generate.html'" class="btn-primary">Create Another Post</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        const topic = localStorage.getItem('postTopic');
        const type = localStorage.getItem('postType');
        
        if (topic) {
            document.getElementById('topicDisplay').innerHTML = `
                <strong>${type === 'quote' ? 'Quote' : 'Topic'}:</strong><br>
                ${topic}
            `;
        }
    </script>
</body>
</html>
