<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Social Media Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Welcome!</h1>
            <p style="text-align: center; margin: 20px 0;">You're successfully logged in.</p>
            <button onclick="window.location.href='generate.html'" class="btn-primary" style="margin-bottom: 10px;">Create New Post</button>
            <button onclick="signOut()" class="btn-secondary">Sign Out</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        async function signOut() {
            const { error } = await supabase.auth.signOut();
            if (error) {
                alert('Error signing out: ' + error.message);
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
